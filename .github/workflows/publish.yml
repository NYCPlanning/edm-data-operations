name: Staging -> Production

on:
  issues:
    types: [ labeled ]

permissions:
  contents: read
  issues: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    if: >-
      ( 
        contains(github.event.issue.title, '[publish]') && 
        contains(github.event.comment.body, '[publish]') && (
          github.event.comment.user.login == 'dhochbaum-dcp'||
          github.event.comment.user.login == 'jpiacentinidcp'
        )
      ) ||  contains(github.event.issue.labels.*.name, 'publish')
    env:
      AWS_S3_BUCKET: edm-publishing
    outputs:
      datasets: ${{ steps.parsing.outputs.datasets }}
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: ./run.sh install

    - name: Parse dataset names
      shell: python
      id: parsing
      # The issue body is untrusted: read it from env rather than ${{ }}, and only
      # pass on names that are safe to word-split into shell commands and S3 paths.
      env:
        ISSUE_BODY: ${{ github.event.issue.body }}
      run: |+
        import os
        import re

        splited = os.environ["ISSUE_BODY"].split('\n')
        start = splited.index("```yml")+1
        end = splited.index("```")
        datasets = [i[2:] for i in splited[start:end]]
        invalid = [d for d in datasets if not re.fullmatch(r"[a-z0-9_]+", d)]
        if invalid:
            raise SystemExit(f"invalid dataset names: {invalid}")
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"datasets={' '.join(datasets)}\n")

    - name: test output
      env:
        DATASETS: ${{ steps.parsing.outputs.datasets }}
      run: echo "$DATASETS"

    - name: Run recipe
      env:
        DATASETS: ${{ steps.parsing.outputs.datasets }}
        AWS_S3_ENDPOINT: ${{ secrets.DO_S3_ENDPOINT }}
        AWS_ACCESS_KEY_ID: ${{ secrets.DO_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SECRET_ACCESS_KEY }}
      run: |+
        for i in $DATASETS
        do
          ./run.sh publish "$i"
        done

  # A separate job so the third-party action never runs where the Spaces keys exist.
  close-issue:
    needs: publish
    runs-on: ubuntu-22.04
    steps:
    - name: Success Message
      uses: peter-evans/close-issue@v1
      with:
        issue-number: ${{ github.event.issue.number }}
        comment: |
          ## Publish Complete!

          ${{ needs.publish.outputs.datasets }}

          *Published By: @${{ github.actor }}* for more details, check [here](https://github.com/NYCPlanning/edm-data-operations/actions/runs/${{ github.run_id }})
